name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Needed so the tag build can create/update the GitHub release (the default token is read-only).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and package
        shell: pwsh
        run: ./build.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: HoYoRefreshSwitcher
          path: dist/*.zip

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
